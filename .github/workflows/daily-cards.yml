# ============================================================
# PROMPT — Daily card generation (NEW CUES DAILY)
# Fires prompt-generate once a day on a rotating category → pending queue.
# Cards land as source='ai', approved=false (Claude/Vince curates before they go live).
# f-keys.com
# ============================================================
name: Daily Cards

# Future-proof JS actions onto Node 24 (Node 20 deprecated 2026-06-16). This job is
# pure bash today, but harmless + consistent with deploy-activity.yml.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily
  workflow_dispatch:       # click "Run workflow" anytime; optionally target a category/count
    inputs:
      category:
        description: 'Category to generate (blank = rotate by day)'
        required: false
        default: ''
      count:
        description: 'How many cards (1-30)'
        required: false
        default: '24'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a fresh batch
        env:
          FN_URL: https://ihclxurachkewtgnrldc.supabase.co/functions/v1/prompt-generate
          ANON: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          ADMIN_TOKEN: ${{ secrets.PROMPT_ADMIN_TOKEN }}
          IN_CAT: ${{ github.event.inputs.category }}
          IN_COUNT: ${{ github.event.inputs.count }}
        run: |
          CATS=(legal hr incident existential aipanic doom unhinged relatable)
          CAT="$IN_CAT"
          if [ -z "$CAT" ]; then
            IDX=$(( $(date +%j) % 8 ))      # rotate category by day-of-year
            CAT=${CATS[$IDX]}
          fi
          COUNT="${IN_COUNT:-24}"
          echo "Generating $COUNT '$CAT' cards..."

          # Gemini answers 503 "high demand" on and off all day, and a single
          # attempt turned that into a red run and a failure email every time
          # it happened. The work is idempotent-ish (cards land unapproved for
          # curation either way), so it is worth waiting out. Five attempts,
          # backing off 30s / 60s / 120s / 240s, covers an eight-minute spike.
          ATTEMPTS=5
          DELAY=30
          for i in $(seq 1 $ATTEMPTS); do
            curl -sS -X POST "$FN_URL" \
              -H "Authorization: Bearer $ANON" \
              -H "Content-Type: application/json" \
              -d "{\"admin_token\":\"$ADMIN_TOKEN\",\"category\":\"$CAT\",\"count\":$COUNT}" \
              > /tmp/out.json 2>/tmp/err.txt || true
            cat /tmp/out.json

            if grep -q '"ok":true' /tmp/out.json; then
              echo "::notice::generated on attempt $i"
              exit 0
            fi

            # Only retry what is worth retrying. A bad token or a rejected
            # payload will fail the same way five times and should say so now.
            if ! grep -qE '503|UNAVAILABLE|high demand|429|RESOURCE_EXHAUSTED|timed? ?out|502|504' /tmp/out.json; then
              echo "::error::generation failed and the error is not transient"
              exit 1
            fi

            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "upstream busy, retrying in ${DELAY}s (attempt $i of $ATTEMPTS)"
              sleep "$DELAY"
              DELAY=$(( DELAY * 2 ))
            fi
          done

          # Out of attempts on a transient upstream. That is Gemini having a bad
          # day, not this repo being broken, and tomorrow's run will pick it up.
          echo "::warning::upstream unavailable after $ATTEMPTS attempts; skipping today's batch"
          exit 0
